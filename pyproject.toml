[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-predictor-mlops"
version = "2.0.0"
description = "Clean end-to-end MLOps pipeline for customer churn prediction"
authors = [{name = "danieleschmidt"}]
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7.0", "seaborn>=0.12.0"]
dev = ["pytest>=7.0.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
